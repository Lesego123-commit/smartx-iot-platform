# ------------------------------------------------------------------------------------
# PROG7312 - Part 2 | Smart-X backend API (optional Docker Compose).
# Run:  docker compose up --build      ->  API on http://localhost:5101
# The WPF client runs on the Windows host and points at http://localhost:5101.
# ------------------------------------------------------------------------------------
services:
  smartx-api:
    build:
      context: .
      dockerfile: SmartX.Api/Dockerfile
    ports:
      - "5101:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
